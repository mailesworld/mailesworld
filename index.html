<SCRIPT>
  var TOTAL = 144892;
  var START = new Date(2025, 11, 27);   // Dec 27, 2025 (months are 0-indexed)
  var END   = new Date(2027, 11, 27);   // Dec 27, 2027

  function fmt(n) { return n.toLocaleString("en-US", {minimumFractionDigits: 4, maximumFractionDigits: 4}); }

  function update() {
    var now = new Date();
    var frac = (END - now) / (END - START);      // share of time remaining
    frac = Math.max(0, Math.min(1, frac));       // clamp to 0..1
    var curr = TOTAL * frac;
    document.getElementById("owed").textContent    = fmt(curr);
    document.getElementById("monthly").textContent = fmt(curr / 36);
  }
  update();
  setInterval(update, 50); 

  // fill in the 2027 schedule (1st of each month)
  var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var tbl = document.getElementById("schedule");
  for (var m = 0; m < 12; m++) {
    var d = new Date(2027, m, 1);
    var owed = TOTAL * (END - d) / (END - START);
    var row = tbl.insertRow();
    row.insertCell().textContent = months[m] + " 1, 2027";
    row.insertCell().textContent = "$" + owed.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
    row.insertCell().textContent = "$" + (owed / 36).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
    if (d <= new Date()) row.style.color = "#888888";   // grey out months already passed
  }
</SCRIPT>
